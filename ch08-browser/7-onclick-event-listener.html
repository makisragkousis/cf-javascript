<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Event Listhener</title>
  </head>
  <body>
    <button
      id="btn"
      type="button"
    >
      Say Hello
    </button>

    <script>
      const btn = document.getElementById("btn");

      btn.addEventListener(
        "click",
        function () {
          console.log("Hello Coding");
        },
        false,
      );
    </script>
  </body>
</html>

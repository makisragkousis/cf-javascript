<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bg Changer App</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./main.css"
    />
  </head>
  <body>
    <!-- fixed-top removes the element from the document flow while sticky-top  reserves/occupies the area space -->
    <nav
      class="navbar navbar-expand-lg fixed-top bg-dark"
      data-bs-theme="dark"
    >
      <div class="container-lg">
        <a
          href="./index.html"
          class="navbar-brand"
          >Bg Color Changer App
        </a>

        <button
          type="button"
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavCollapsible"
          aria-controls="navbarNavCollapsible"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse"
          id="navbarNavCollapsible"
        >
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a
                class="nav-link"
                href="./index.html"
                >Restricted App</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="./rich.html"
                class="nav-link"
                >Rich App
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <div
        class="d-flex flex-column justify-content-center align-items-center outer"
      >
        <div class="bg-dark py-3 px-5 text-center rounded-3">
          <h4 class="text-white">Background color:</h4>
          <h4
            id="color"
            class="text-white"
            aria-live="polite"
          >
            #FFF
          </h4>
        </div>
        <button
          type="button"
          id="btn"
          class="btn btn-lg btn-outline-primary mt-4"
        >
          Click Me
        </button>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="./rich.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Counter App</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./main.css"
    />
  </head>
  <body>
    <main>
      <div
        class="root d-flex flex-column justify-content-center align-items-center"
      >
        <div class="text-center">
          <div class="mb-4">
            <h1 class="display-2">Counter</h1>
          </div>
          <div class="border border-black rounded-pill">
            <span
              id="counter"
              class="display-2"
              aria-live="polite"
              >0</span
            >
          </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex mt-4">
          <div class="me-2">
            <button
              id="btnDecr"
              class="btn btn-lg btn-outline-primary"
              aria-label="Decrease counter"
            >
              Decrease
            </button>
          </div>
          <div class="me-2">
            <button
              id="btnReset"
              class="btn btn-lg btn-outline-primary"
              aria-label="Reset counter"
            >
              Reset
            </button>
          </div>
          <div>
            <button
              id="btnIncr"
              class="btn btn-lg btn-outline-primary"
              aria-label="Increase counter"
            >
              Increase
            </button>
          </div>
        </div>
      </div>
    </main>

    <script
      type="module"
      src="controller.js"
    ></script>
  </body>
</html>

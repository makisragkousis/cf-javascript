<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Async await with Fetch API and POST</title>
  </head>
  <body>
    <h1>Uses async await with axios to get data</h1>
    <button
      id="btn"
      type="button"
    >
      Fetch One Object
    </button>
    <p id="output"></p>

    <script>
      document.getElementById("btn").addEventListener("click", async () => {
        try {
          const payload = {
            title: "Coding",
            body: "Coding Factory",
            userId: 1,
          };

          const options = {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          };

          let response = await fetch(
            "https://jsonplaceholder.typicode.com/posts",
            options,
          );

          if (!response.ok) {
            throw new Error("Invalid response");
          }

          let data = await response.json();

          document.getElementById("output").innerHTML =
            `<strong>Id</strong> ${data.id} <br><br> ${data.title} <br><br> ${data.body}`;
        } catch (error) {
          console.error("Fetch error", error);
          document.getElementById("output").textContent = "Error fetching data";
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Async await axios get</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  </head>
  <body>
    <h1>Uses async await with axios to get data</h1>
    <button
      id="btn"
      type="button"
    >
      Fetch One Object
    </button>
    <p id="output"></p>

    <script>
      document.getElementById("btn").addEventListener("click", async () => {
        try {
          let response = await axios.get(
            "https://jsonplaceholder.typicode.com/posts/1",
          );
          document.getElementById("output").innerHTML =
            `Title: ${response.data.title} <br><br> ${response.data.body} `;
        } catch (error) {
          console.error("Error: ", error);
          document.getElementById("output").textContent = "Error fetching data";
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Fetch API Post</title>
  </head>
  <body>
    <h1>Fetch API Post Request</h1>
    <button
      type="button"
      onclick="createPost()"
    >
      Send One Object with POST
    </button>
    <p id="responseText"></p>

    <script>
      const createPost = () => {
        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            title: "Coding Factory",
            body: "Coding Factory says Hello",
            userId: 1,
          }),
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP Error. Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            document.getElementById("responseText").textContent =
              `Post created with title: ${data.title}`;
          })
          .catch((error) => {
            console.error("Error", error); // Dev Logging
            document.getElementById("responseText").textContent =
              `Error ${error.message}`; // User-friendly
          });
      };
    </script>
  </body>
</html>

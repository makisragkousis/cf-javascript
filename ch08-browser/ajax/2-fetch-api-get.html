<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>FETCH API Get Request</title>
  </head>
  <body>
    <h1>Fetch API Get Request</h1>
    <button
      type="button"
      onclick="fetchOneObj()"
    >
      Fetch One Object
    </button>
    <p id="responseText"></p>

    <script>
      function fetchOneObj() {
        fetch("https://jsonplaceholder.typicode.com/posts/1")
          .then((response) => {
            // checks 200 - 299
            if (!response.ok) {
              throw new Error(`HTTP error. Status: ${response.status}`);
            }
            // parse το json string και το μετατρέπει σε JS object
            return response.json();
          })
          .then((data) => {
            document.getElementById("responseText").textContent =
              `Title: ${data.title}`;
          })
          .catch((error) => console.error("Error: " + error));
      }
    </script>
  </body>
</html>
